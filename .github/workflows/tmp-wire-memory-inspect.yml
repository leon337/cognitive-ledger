name: tmp wire governed memory inspect

on:
  push:
    branches:
      - feature/governed-shared-memory-20260922

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/governed-shared-memory-20260922
      - name: Patch Edge routing deterministically
        shell: python
        run: |
          from pathlib import Path

          path = Path("supabase/functions/cognitive-ledger-api/index.ts")
          text = path.read_text()

          replacements = [
              (
                  'import { ErroMemoriaWrite, tratarRotaWrite } from "./lib/api-write.ts";\n',
                  'import {\n  ErroMemoriaInspect,\n  tratarRotaMemoryInspect,\n} from "./lib/api-memory-inspect.ts";\nimport { ErroMemoriaWrite, tratarRotaWrite } from "./lib/api-write.ts";\n',
              ),
              (
                  '  if (erro instanceof ErroMemoriaWrite) {\n    return json({ erro: erro.codigo }, erro.status);\n  }\n',
                  '  if (erro instanceof ErroMemoriaWrite) {\n    return json({ erro: erro.codigo }, erro.status);\n  }\n  if (erro instanceof ErroMemoriaInspect) {\n    return json({ erro: erro.codigo }, erro.status);\n  }\n',
              ),
              (
                  '  "proximos_passos",\n].join(",");\n',
                  '  "proximos_passos",\n  "metadados",\n].join(",");\n',
              ),
              (
                  '      const resultado = await tratarRotaReadOnly(req, identidade, {\n',
                  '      const inspecao = await tratarRotaMemoryInspect(req, identidade, {\n        repositorio: repositorioRecuperacao(supabase),\n      });\n      if (inspecao) {\n        return json(inspecao.corpo, inspecao.status, inspecao.headers);\n      }\n\n      const resultado = await tratarRotaReadOnly(req, identidade, {\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          path.write_text(text)
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - run: deno fmt supabase/functions/cognitive-ledger-api/index.ts
      - name: Commit route wiring if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/cognitive-ledger-api/index.ts
          git commit -m "feat(memory): wire scoped inspect route"
          git push origin HEAD:feature/governed-shared-memory-20260922
