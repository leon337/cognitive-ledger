name: Validar protótipo estrutural

on:
  push:
    branches:
      - main
      - design/cognitive-ledger-foundation
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validar Edge Function com Deno
        id: deno_check
        continue-on-error: true
        run: |
          set +e
          deno check supabase/functions/cognitive-ledger-api/index.ts > deno-check.log 2>&1
          status=$?
          cat deno-check.log
          printf '%s\n' "$status" > deno-check.exit
          exit "$status"

      - name: Publicar diagnóstico do Deno
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deno-check
          path: |
            deno-check.log
            deno-check.exit
          if-no-files-found: error

      - name: Falhar se Deno check falhou
        if: steps.deno_check.outcome == 'failure'
        run: exit 1

      - name: Validar sintaxe JavaScript
        run: |
          node --check site/dados/registros.js
          node --check site/scripts/aplicacao.js

      - name: Validar estrutura do protótipo
        run: node site/testes/validar-estrutura.mjs
