<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Cognitive Ledger</title>
</head>
<body>
  <main>
    <h1>Entrar no Cognitive Ledger</h1>
    <p id="estado">Use a identidade autorizada do proprietário.</p>
    <form id="form-login">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button id="enviar" type="submit">Enviar link de acesso</button>
    </form>
  </main>
  <script src="/oauth/config.js"></script>
  <script type="module" src="/oauth/login.js"></script>
</body>
</html>
